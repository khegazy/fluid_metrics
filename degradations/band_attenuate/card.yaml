schema_version: 1

name: band_attenuate
kind: degradation
category: spectral

summary: >-
  Weakens one chosen band of scales and leaves every larger and smaller scale untouched,
  by scaling down the Fourier modes between two fixed wavenumbers.

status: control
owners: [khegazy]

failure_mode: >-
  A surrogate that has lost its fine structure, imitated by deleting it outright rather
  than smoothing it away.

output:
  description: >-
    Fraction of the field's spectral energy above the cutoff that the filter removes,
    resolved per field to a cutoff wavenumber against a measured spectrum.
  bounds:
    lower: 0.0
    upper: null

exemplars:
  mode: severity
  levels: [0.8, 0.5, 0.0]
  field_name: vorticity
  diagnostics: [difference, radial_spectrum]
  rationale: >-
    Three fractions spanning the usable range of this axis. The radial spectrum row is the
    one that shows the mechanism directly -- the cutoff is visible as the wavenumber where
    the curve departs from the reference -- and the difference row shows which structures
    in real space carried the removed energy.

references: []
review: null
