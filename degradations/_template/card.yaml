# Which severities to illustrate, and how. A degradation whose effect is never shown
# cannot be understood from prose alone, so this block is required.
exemplars:
  # severity -> three severities beside the original, weakest first
  # draws    -> several independent draws beside the original, for a degradation whose
  #             severity carries no order (a phase randomiser, an unrelated-field anchor)
  # none     -> no panel; only the identity operator qualifies
  mode: severity
  levels: [0.0, 0.0, 0.0]   # TODO(fill) three severities this ladder actually uses
  field_name: vorticity
  # Extra panel rows beyond the field itself. Choose the ones that expose the mechanism:
