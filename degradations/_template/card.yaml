# In one sentence: which way of being wrong does this stand in for? A degradation is not
# interesting as an image operation; it is interesting as a model failure it imitates.
failure_mode: TODO(fill)

output:
  description: TODO(fill) what the severity number means, in one sentence.
  bounds:
    lower: 0.0
