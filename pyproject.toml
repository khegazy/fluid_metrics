[project]
name = "fluid-metrics"
version = "0.1.0"
description = "Metrics for quantifying the quality of fluid simulations and ML surrogates"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "h5py>=3.11",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "tqdm", "rich"]
# Only needed for criterion 18 (gradient signal). Kept out of the default set so a
# broken torch install cannot block the metric suite, and because the default PyPI
# wheel is not the build you want for Perlmutter GPUs.
torch = ["torch>=2.4"]
wandb = ["wandb>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metrics", "degradations", "fmeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: reads real files on CFS (skipped by default)",
    "slow: needs LaTeX or a long runtime (skipped by default)",
]
addopts = "-m 'not data and not slow'"
