schema_version: 1

name: enstrophy
kind: metric
category: physics_invariants

summary: >-
  Mean squared vorticity of a single field, a reference-free diagnostic of how much
  small-scale rotational activity a flow carries.

# A tripwire rather than a candidate: one scalar cannot distinguish a good prediction from
# a bad one, but a large drift from the reference is worth noticing.
status: control
owners: [khegazy]

output:
  description: >-
    Half the mean squared vorticity magnitude, summed over components, in the square of the
    vorticity units. Reported per variant; the drift from the reference is what is read.
  bounds:
    lower: 0.0
    upper: null

math:
  triangle_inequality: false   # not a distance at all: it takes one field, not two
  scale_dependent: true        # scaling the field by c scales the value by c squared
  resolution_dependent: true   # a coarser grid resolves less of the small-scale vorticity
  complexity: "O(N)"
references: []
review: null
